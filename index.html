</style>

async function gql(query, tries = 0){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  let r;
  try { r = await fetch(API, {method:"POST", signal:ctl.signal, headers:{"Content-Type":"application/json", Accept:"application/json"}, body:JSON.stringify({query})}); }
  catch (e) { throw new Error(e.name === "AbortError" ? "Timeout" : "Offline / blocked"); }
  finally { clearTimeout(timer); }
  if (r.status === 429 && tries < 3) { await new Promise(s => setTimeout(s, (+r.headers.get("Retry-After") || 5) * 1000)); return gql(query, tries + 1); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.errors) throw new Error("AniList " + r.status);
  return j.data;
}

const nm = m => {
  const sc = m.averageScore ? (m.averageScore / 10).toFixed(1) : "";
  return {id:m.id, adult:!!m.isAdult, name:m.title.english || m.title.romaji, jp:m.title.native || "", ro:m.title.romaji && m.title.romaji !== (m.title.english || m.title.romaji) ? m.title.romaji : "", img:m.coverImage.large, score:sc,
    mcg:m.characters ? (m.characters.nodes[0] || {}).gender || "" : "",
    mcl:m.characters ? ({Male:t("male"), Female:t("female")}[(m.characters.nodes[0] || {}).gender] || (m.characters.nodes[0] || {}).gender || t("unk")) : undefined,
    meta:[m.format, m.startDate && m.startDate.year, m.episodes ? m.episodes + " eps" : m.chapters ? m.chapters + " ch" : ""].filter(Boolean).join(" · "),
    info:["★ " + (sc || "-"), t("st")[m.status] || "", (m.genres || []).join(", ")].filter(Boolean).join(" · "),
    text:clean(m.description) || t("nod"), url:m.siteUrl};
};

function filt(extra){
  const a = [];
  const gs = S.genres.filter(n => GSET.has(n)), ts = S.genres.filter(n => !GSET.has(n));
  if (gs.length) a.push("genre_in:" + JSON.stringify(gs));
  if (ts.length) a.push("tag_in:" + JSON.stringify(ts));
  if (S.year) a.push(`startDate_greater:${S.year * 10000},startDate_lesser:${(+S.year + 1) * 10000}`);
  if (extra) a.push(extra);
  if (S.done) a.push("status:FINISHED");
  else if (S.sort.startsWith("START")) a.push("status_not:NOT_YET_RELEASED");
  if (S.sort.startsWith("SCORE")) a.push("averageScore_greater:0");
  a.push("sort:" + S.sort);
  return a.join(",");
}

function builder(){
  const k = S.tab;
  if (k === "waifu") return {kind:"char", rank:1, q:p => `{Page(page:${p},perPage:50){pageInfo{hasNextPage} characters(sort:FAVOURITES_DESC){${C}}}}`};
  if (k === "sched") {
    const s = new Date(); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() + (S.wd - s.getDay() + 7) % 7);
    const f = Math.floor(s / 1000) - 1, e = f + 86401;
    const pg = n => `Page(page:${n},perPage:50){airingSchedules(airingAt_greater:${f},airingAt_lesser:${e},sort:TIME){airingAt episode media{${M} isAdult}}}`;
    return {kind:"sched", q:() => `{a:${pg(1)} b:${pg(2)}}`};
  }
  let a;
  if (k === "search") a = `search:${JSON.stringify(S.q)},sort:SEARCH_MATCH`;
  else if (k === "pop") a = "sort:POPULARITY_DESC";
  else if (k === "rank") a = "sort:SCORE_DESC";
  else if (k === "new") a = P.mode === "ANIME" ? `season:${SN},seasonYear:${SY},sort:POPULARITY_DESC` : "status:RELEASING,sort:TRENDING_DESC";
  else a = filt(k === "rec" ? "popularity_greater:5000" : "");
  return {kind:"media", rank:k === "rank", mc:k === "rec" || k === "genre", q:p => mq(a, p)};
}

function norm(data, kind){
  if (kind === "char") return {more:data.Page.pageInfo.hasNextPage, items:data.Page.characters.filter(c => c.gender === "Female").map(c => ({
    name:c.name.full, jp:c.name.native || "", img:c.image.large, score:"", meta:(c.favorites || 0).toLocaleString(P.lang) + " " + t("fav") + (c.media.nodes[0] ? " · " + c.media.nodes[0].title.romaji : ""),
    info:c.name.native || "", text:clean(c.description) || t("nod"), url:c.siteUrl}))};
  if (kind === "sched") {
    const seen = new Set(), out = [];
    [...data.a.airingSchedules, ...data.b.airingSchedules].forEach(x => {
      if ((x.media.isAdult && !adultOk()) || seen.has(x.media.id)) return;
      seen.add(x.media.id);
      const o = nm(x.media);
      o.badge = new Date(x.airingAt * 1000).toLocaleTimeString(P.lang, {hour:"2-digit", minute:"2-digit", hour12:false});
      o.meta = "Ep " + x.episode + " · " + o.meta; o.pop = x.media.popularity || 0;
      out.push(o);
    });
    return {more:false, items:out.sort((a, b) => b.pop - a.pop)};
  }
  return {more:data.Page.pageInfo.hasNextPage, items:data.Page.media.map(nm)};
}

function cards(items, from, rank){
  return items.map((o, i) => {
    const n = from + i, b = o.badge ? `<span class="bd">${esc(o.badge)}</span>` : rank ? `<span class="bd">#${n + 1}</span>` : "";
    return `<button class="card${o.adult && !adultOk() ? " adult" : ""}" data-i="${n}"><span class="im">${b}${o.adult ? '<span class="ad">18+</span>' : ""}${o.score ? `<span class="sc">★ ${o.score}</span>` : ""}<img loading="lazy" src="${esc(o.img)}" alt="${esc(o.name)}"></span><span class="t">${esc(o.name)}</span>${jpl(o) ? `<span class="m">${esc(jpl(o))}</span>` : ""}<span class="m">${esc(o.meta)}</span></button>`;
  }).join("");
}

async function run(append){
  if (S.tab === "news") return showNews();
  if (S.tab === "favT") { token++; return showFav(); }
  const my = ++token, out = $("out");
  if (!append) { st = {list:[], page:1, more:false, b:builder()}; out.innerHTML = `<p class="msg">${t("load")}</p>`; $("more").hidden = true; }
  else st.page++;
  try {
    const r = norm(await gql(st.b.q(st.page)), st.b.kind);
    if (my !== token) return;
    if (S.mc && st.b.mc) r.items = r.items.filter(o => o.mcg === S.mc);
    const from = st.list.length;
    st.list = st.list.concat(r.items); st.more = r.more;
    const auto = (st.b.kind === "char" || (S.mc && st.b.mc)) && st.more && st.list.length < 15 && st.page < 10;
    if (!st.list.length) out.innerHTML = `<p class="msg">${auto ? t("load") : t("empty")}</p>`;
    else if (append && from > 0) out.insertAdjacentHTML("beforeend", cards(r.items, from, st.b.rank));
    else out.innerHTML = cards(r.items, 0, st.b.rank);
    $("more").hidden = !st.more;
    if (auto) run(true);
  } catch (e) {
    if (my !== token) return;
    if (append) st.page--;
    out.innerHTML = `<p class="msg">${t("err")} (${esc(e.message)})<br><br><button class="pri" id="retry">${t("retry")}</button></p>`;
    $("retry").onclick = () => run(false);
  }
}

const TR = new Map();
async function tr(text){
  if (TR.has(text)) return TR.get(text);
  const chunks = []; let cur = "";
  for (const p of text.split(/\n+/).filter(Boolean)) {
    if (cur && (cur + "\n" + p).length > 1800) { chunks.push(cur); cur = p; } else cur = cur ? cur + "\n" + p : p;
  }
  if (cur) chunks.push(cur);
  const out = [];
  for (const c of chunks) {
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=id&dt=t&q=" + encodeURIComponent(c), {signal:AbortSignal.timeout(15000)});
    if (!r.ok) throw new Error("tr");
    const j = await r.json();
    out.push(j[0].map(x => x[0]).join(""));
  }
  const res = out.join("\n\n"); TR.set(text, res); return res;
}

  const info = [[D.air, nx ? D.next + " " + nx.episode + " · " + new Date(nx.airingAt * 1000).toLocaleString(P.lang, {dateStyle:"medium", timeStyle:"short"}) : "-"],
    [D.fmt, m.format || "-"], [D.ep, m.episodes || m.chapters || "-"], [D.dur, m.duration ? m.duration + " " + D.min : "-"], [D.stat, t("st")[m.status] || m.status || "-"],
    [D.sd, fd(m.startDate)], [D.ed, fd(m.endDate)], [D.sea, m.season ? m.season[0] + m.season.slice(1).toLowerCase() + " " + (m.seasonYear || "") : "-"],
    [D.pop, (m.popularity || 0).toLocaleString(P.lang)], [D.stu, m.studios.nodes.map(x => x.name).join(", ") || "-"], [D.gen, m.genres.join(", ") || "-"], [D.typ, m.type],
    [D.ro, m.title.romaji || "-"], [D.en, m.title.english || "-"], [D.na, m.title.native || "-"], [D.syn, m.synonyms.join(", ") || "-"], [D.age, m.isAdult ? D.age18 : D.ageAll]]
    .map(([a, b]) => `<div class="ii"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
  let hero;
  const src = T && T.id ? (T.site === "youtube" ? "https://www.youtube.com/embed/" + T.id + "?autoplay=1&rel=0" : T.site === "dailymotion" ? "https://www.dailymotion.com/embed/video/" + T.id + "?autoplay=1" : "") : "";
  if (src) hero = `<div class="hero" data-v="${esc(src)}"><img src="${esc(m.bannerImage || (T.site === "youtube" ? "https://i.ytimg.com/vi/" + T.id + "/hqdefault.jpg" : m.coverImage.large))}" alt=""><span class="play">▶</span></div>`;
  else hero = `<div class="hero" style="cursor:default"><img class="${m.bannerImage ? "" : "cv"}" src="${esc(m.bannerImage || m.coverImage.large)}" alt=""></div>`;
  const ppl = e => e.length ? `<div class="hs">${e.map(x => `<div class="pr"><img loading="lazy" src="${esc(x.node.image.medium)}" alt=""><span>${esc(x.node.name.full)}</span><small>${esc(String(x.role || "").replace(/_/g, " ").toLowerCase())}</small></div>`).join("")}</div>` : "";
  const rc = (n, lab) => `<button class="card" data-p="${n.id}"><span class="im"><img loading="lazy" src="${esc(n.coverImage.large)}" alt=""></span><span class="t">${esc(n.title.english || n.title.romaji)}</span><span class="m">${esc(lab)}</span></button>`;
  const grid = h => h ? `<div class="grid">${h}</div>` : "";
  const sec = (ti, b) => b ? `<h3 class="sh">${esc(ti)}</h3>${b}` : "";
  const rl = m.relations.edges, nice = r => r.replace(/_/g, " ").toLowerCase();
  const seq = rl.filter(e => e.relationType === "SEQUEL").map(e => rc(e.node, nice(e.relationType))).join("");
  const oth = rl.filter(e => e.relationType !== "SEQUEL").map(e => rc(e.node, nice(e.relationType))).join("");
  const sim = m.recommendations.nodes.map(n => n.mediaRecommendation).filter(Boolean).map(n => rc(n, n.averageScore ? "★ " + (n.averageScore / 10).toFixed(1) : "")).join("");
  const sd = m.stats.statusDistribution || [], tot = sd.reduce((a, x) => a + x.amount, 0) || 1, sb = m.stats.scoreDistribution || [], mx = Math.max(1, ...sb.map(x => x.amount));
  const stats = `<div class="sub">★ ${sc || "-"} · ${D.favs}: ${(m.favourites || 0).toLocaleString(P.lang)}</div><h4>${D.dist}</h4>` +
    sd.map(x => `<div class="br"><span>${esc(D.u[x.status] || x.status)}</span><i><b style="width:${Math.round(x.amount / tot * 100)}%"></b></i><em>${x.amount.toLocaleString(P.lang)}</em></div>`).join("") +
    `<h4>${D.sdist}</h4><div class="sbs">${sb.map(x => `<div class="sb"><b style="height:${Math.round(x.amount / mx * 100)}%"></b>${x.score}</div>`).join("")}</div>`;
  $("pgb").innerHTML = hero + `<h1>${esc(name)}</h1><div class="sub">${esc([o.jp, o.ro].filter(Boolean).join(" · "))}</div>
    <div class="row" style="margin:12px 0"><button class="chip" id="pfav"></button><a class="chip" href="${esc(m.siteUrl)}" target="_blank" rel="noopener">AniList ↗</a></div>
    <div class="ig">${info}</div>` +
    sec(D.ov, `<p id="pov" style="white-space:pre-line;font-size:.9rem;color:var(--mu)">${esc(o.text)}</p><div id="pnote" class="sub"></div>`) +
    sec(D.ch, ppl(m.characters.edges)) + sec(D.sf, ppl(m.staff.edges)) + sec(D.sts, stats) +
    sec(D.s2, grid(seq)) + sec(D.rel, grid(oth)) + sec(D.sim, grid(sim));
  const fb = () => { $("pfav").textContent = favHas(o.id) ? t("favOn") : t("favAdd"); };
  fb(); $("pfav").onclick = () => { favToggle(o); fb(); };
  if (P.lang === "id" && o.text !== t("nod")) tr(o.text).then(x => { if (pgO === o) { $("pov").textContent = x; $("pnote").textContent = D.trn; } }).catch(() => {});
}
$("pgb0").onclick = pgBack;
$("pgb").onclick = e => {
  const c = e.target.closest("[data-p]"), v = e.target.closest("[data-v]");
  if (c) openPage(+c.dataset.p);
  else if (v) { v.innerHTML = `<iframe src="${esc(v.dataset.v)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; v.removeAttribute("data-v"); v.style.cursor = "default"; }
};

// ---- News ----
let newsCache = null;
async function resolveNews(titles){
  const map = {};
  for (let i = 0; i < titles.length; i += 6) {
    const part = titles.slice(i, i + 6);
    const q = "{" + part.map((x, k) => `a${k}:Media(search:${JSON.stringify(x)},${adultOk() ? "" : "isAdult:false,"}sort:SEARCH_MATCH){id title{romaji english} coverImage{large} bannerImage studios(isMain:true){nodes{name}}}`).join(" ") + "}";
    try {
      const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json", Accept:"application/json"}, body:JSON.stringify({query:q})});
      const j = await r.json().catch(() => ({}));
      part.forEach((x, k) => { const m = (j.data || {})["a" + k]; if (m) map[x] = {id:m.id, name:m.title.english || m.title.romaji, img:m.coverImage.large, banner:m.bannerImage || "", studio:(m.studios.nodes[0] || {}).name || ""}; });
    } catch (e) {}
  }
  return map;
}
function newsHTML(l){
  const loc = P.lang === "id" ? "id-ID" : "en-US";
  return `<div class="nl">` + l.map((x, i) => {
    const a = x.a, d = x.date ? new Date(x.date).toLocaleDateString(loc, {day:"numeric", month:"long", year:"numeric"}) : "";
    const pic = a ? a.img : x.img;
    const img = pic ? `<button class="nimg" data-n="${i}"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(pic)}" alt=""></button>` : `<button class="nimg" data-n="${i}">📰</button>`;
    return `<article class="ni">${img}<div class="nb">${a ? `<button class="nn" data-p="${a.id}">${esc(a.name)}</button>` : ""}${a && a.studio ? `<div class="sub">${t("nStudio")}: ${esc(a.studio)}</div>` : ""}<h4>${esc(x.title)}</h4><div class="sub">${esc(d)} · ${esc(x.source)}</div><button class="chip" data-n="${i}">${t("nOpen")}</button></div></article>`;
  }).join("") + `</div>`;
}
function openNews(i){
  const x = newsCache && newsCache[i]; if (!x) return;
  pgStack.push("n" + i);
  if ($("dlg").open) $("dlg").close();
  $("pg").hidden = false; document.body.style.overflow = "hidden"; $("pg").scrollTop = 0; $("pgb0").textContent = t("back");
  const a = x.a, im = x.img || (a && (a.banner || a.img)) || "", cov = !x.img && !(a && a.banner);
  const d = x.date ? new Date(x.date).toLocaleDateString(P.lang === "id" ? "id-ID" : "en-US", {day:"numeric", month:"long", year:"numeric"}) : "";
  $("pgb").innerHTML = (im ? `<div class="hero" style="cursor:default"><img class="${cov ? "cv" : ""}" referrerpolicy="no-referrer" src="${esc(im)}" alt=""></div>` : "") +
    `<h1>${esc(x.title)}</h1><div class="sub">${esc(d)} · ${esc(x.source)}</div>` +
    (a ? `<button class="ni" data-p="${a.id}" style="margin:14px 0;width:100%;text-align:left"><span class="nimg"><img src="${esc(a.img)}" alt=""></span><span class="nb"><b class="nn">${esc(a.name)}</b>${a.studio ? `<span class="sub">${t("nStudio")}: ${esc(a.studio)}</span>` : ""}<span class="sub">${t("nSee")} →</span></span></button>` : "") +
    (x.desc ? `<p id="nd" style="white-space:pre-line;font-size:.92rem;margin:14px 0 4px">${esc(x.desc)}</p><div id="nnote" class="sub"></div>` : "") +
    `<div class="row" style="margin-top:16px"><a class="chip" href="${esc(x.link)}" target="_blank" rel="noopener">${t("nSrc")}: ${esc(x.source)} ↗</a></div>`;
  if (P.lang === "id" && x.desc) tr(x.desc).then(r => { if (pgStack[pgStack.length - 1] === "n" + i) { $("nd").textContent = r; $("nnote").textContent = t("d").trn; } }).catch(() => {});
}
async function showNews(){
  const my = ++token;
  st = {list:[], page:1, more:false, b:{kind:"media", rank:false}};
  $("more").hidden = true;
  $("out").innerHTML = `<p class="msg">${t("load")}</p>`;
  try {
    if (!newsCache) {
      const r = await fetch("/api/news"), j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
      const map = await resolveNews([...new Set(j.items.map(x => x.anime).filter(Boolean))]);
      newsCache = j.items.map(x => ({...x, a:x.anime ? map[x.anime] || null : null}));
    }
    if (my !== token) return;
    $("out").innerHTML = newsCache.length ? newsHTML(newsCache) : `<p class="msg">${t("nNone")}</p>`;
  } catch (e) {
    if (my !== token) return;
    $("out").innerHTML = `<p class="msg">${t("err")} (${esc(e.message)})<br><br><button class="pri" id="retry">${t("retry")}</button></p>`;
    $("retry").onclick = showNews;
  }
}

// ---- Chat AI (hilang saat ditutup) ----
let chatMsgs = [], CL = [], busy = false, shown = new Set();
const cm = $("cmsgs");
function addMsg(role, text){
  const d = document.createElement("div");
  d.className = "mb " + (role === "user" ? "u" : "a");
  d.textContent = text;
  cm.appendChild(d); cm.scrollTop = cm.scrollHeight;
  return d;
}
function openChat(){
  $("chat").hidden = false; $("fab").hidden = true;
  const d = addMsg("ai", t("chatHi"));
  const row = document.createElement("div"); row.className = "row"; row.style.marginTop = "8px";
  row.innerHTML = t("chips").map(c => `<button class="chip" data-s="${esc(c)}">${esc(c)}</button>`).join("");
  d.appendChild(row);
  $("cq").focus();
}
function closeChat(){
  $("chat").hidden = true; $("fab").hidden = false;
  chatMsgs = []; CL.length = 0; shown = new Set(); cm.innerHTML = ""; busy = false;
}
async function resolveTitles(titles, kind){
  const type = kind === "MANGA" ? "MANGA" : "ANIME", found = [], seen = new Set();
  for (let i = 0; i < titles.length; i += 6) {
    const q = "{" + titles.slice(i, i + 6).map((x, k) => `a${k}:Media(search:${JSON.stringify(x)},type:${type},isAdult:false,sort:SEARCH_MATCH){${M} ${MC}}`).join(" ") + "}";
    for (let n = 0; n < 2; n++) {
      try {
        const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json", Accept:"application/json"}, body:JSON.stringify({query:q})});
        if (r.status === 429) { await new Promise(s => setTimeout(s, 3000)); continue; }
        const j = await r.json().catch(() => ({}));
        Object.values(j.data || {}).forEach(m => { if (m && !seen.has(m.id)) { seen.add(m.id); found.push(m); } });
      } catch (e) {}
      break;
    }
  }
  return found.map(nm);
}
async function sendChat(text){
  if (busy || !text) return;
  busy = true; addMsg("user", text); chatMsgs.push({role:"user", content:text});
  const wait = addMsg("ai", "…");
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:chatMsgs, lang:P.lang, mode:P.mode})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    if ($("chat").hidden) return;
    chatMsgs.push({role:"assistant", content:JSON.stringify({reply:j.reply, kind:j.kind, titles:j.titles})});
    wait.textContent = j.reply || "";
    if (j.titles.length) {
      const items = await resolveTitles(j.titles, j.kind);
      if ($("chat").hidden) return;
      const fresh = items.filter(o => !shown.has(o.url));
      fresh.forEach(o => shown.add(o.url));
      if (!fresh.length) {
        const n = document.createElement("div");
        n.style.cssText = "font-size:.78rem;color:var(--mu);margin-top:6px";
        n.textContent = (P.lang === "id" ? "Tidak ada judul baru yang bisa ditampilkan. Saran AI: " : "No new titles could be shown. AI suggested: ") + j.titles.join("; ");
        wait.appendChild(n);
      } else {
        const from = CL.length; CL.push(...fresh);
        const g = document.createElement("div"); g.className = "grid cg";
        g.innerHTML = cards(fresh, from, false).replaceAll('data-i="', 'data-c="');
        wait.appendChild(g);
      }
    }
  } catch (e) { if (!$("chat").hidden) wait.textContent = t("chatErr") + " (" + e.message + ")"; }
  finally { busy = false; cm.scrollTop = cm.scrollHeight; }
}
$("fab").onclick = openChat;
$("cx").onclick = closeChat;
$("cf").onsubmit = e => { e.preventDefault(); const v = $("cq").value.trim(); $("cq").value = ""; sendChat(v); };
cm.onclick = e => {
  const c = e.target.closest(".card"), h = e.target.closest("[data-s]");
  if (c) openDetail(CL[c.dataset.c]); else if (h) sendChat(h.dataset.s);
};

document.documentElement.style.setProperty("--cols", P.cols);
applyTheme(); applyMode(); applyLang(); run(false);
