<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimangaList</title>
<meta name="theme-color" content="#2563eb">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fd;--sf:#fff;--ink:#0e1a33;--mu:#5b6985;--ac:#2563eb;--ac2:#e6eeff;--ln:#d9e3f5;--r:12px}
:root{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a1122;--sf:#111b33;--ink:#e8eefc;--mu:#93a3c6;--ac:#5b8cff;--ac2:#18274a;--ln:#22335c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
input,select{-webkit-appearance:none;appearance:none}
input::-webkit-search-cancel-button,input::-webkit-search-decoration{-webkit-appearance:none;display:none}
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}details[open]>summary::before{content:"▾ "}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::selection{background:var(--ac);color:#fff}
input:focus{border-color:var(--ac)}
body{-webkit-touch-callout:none;overscroll-behavior:none}
.card,.chip,.gb,.ddb,.ddo,nav button,.seg button,.ic,.x{-webkit-user-select:none;user-select:none}
.dd{position:relative;display:inline-block}
.ddb{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-size:.88rem;font-weight:600}
.ddb i{font-style:normal;color:var(--mu);font-size:.7rem}
.ddm{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;max-height:40vh;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;z-index:30;box-shadow:0 10px 28px rgba(5,10,30,.28)}
.ddo{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;white-space:nowrap;font-size:.88rem}
.ddo.on{background:var(--ac2);color:var(--ac);font-weight:700}
#set{overflow:visible}#set .ddm{left:auto;right:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;user-select:none;-webkit-user-select:none;border:0;background:none;padding:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 14px 8px}
.bar,nav,main{max-width:1100px;margin-inline:auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
h1 span{color:var(--ac)}
.seg{display:flex;background:var(--ac2);border-radius:99px;padding:3px}
.seg button{padding:5px 14px;border-radius:99px;font-weight:600;font-size:.85rem;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff}
.ic{width:36px;height:36px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:1.1rem;margin-left:auto}
form{flex:1 1 100%;display:flex;gap:6px;order:5}
input,select{padding:8px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf)}
form input{flex:1;border-radius:99px;min-width:0}
.pri{background:var(--ac);color:#fff;font-weight:700;border-radius:99px;padding:8px 18px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav button,.chip{white-space:nowrap;padding:6px 13px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-size:.85rem;font-weight:600;background:var(--sf)}
nav button.on,.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:16px 14px 50px}
h2{margin:0 0 12px;font-size:1.1rem}
#ctl{margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details summary{cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ac);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:12px}
.card{position:relative;text-align:left;display:block;width:100%}
.card .im{position:relative;border-radius:10px;overflow:hidden;background:var(--ln)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.card .t{margin-top:6px;font-weight:600;font-size:clamp(.66rem,1.5vw,.84rem);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:clamp(.6rem,1.2vw,.72rem);color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{position:absolute;top:5px;left:5px;background:var(--ac);color:#fff;font-weight:800;font-size:.7rem;padding:1px 7px;border-radius:99px}
.sc{position:absolute;bottom:5px;right:5px;background:rgba(10,17,34,.82);color:#ffd36b;font-weight:700;font-size:.68rem;padding:1px 7px;border-radius:99px}
.msg{color:var(--mu);text-align:center;padding:36px 0;grid-column:1/-1}
#more{display:block;margin:20px auto 0}
dialog{border:0;border-radius:16px;background:var(--sf);color:var(--ink);width:92%;max-width:520px;padding:18px}
dialog::backdrop{background:rgba(5,10,25,.6)}
.dl{display:flex;gap:14px}
.dl img{width:120px;height:fit-content;border-radius:10px}
.dl h3{margin:0 0 4px}
.dl p{font-size:.85rem;color:var(--mu);max-height:230px;overflow:auto;white-space:pre-line;margin:8px 0}
.dl a{color:var(--ac);font-weight:700}
.x{float:right;font-size:1.4rem;color:var(--mu);margin:-6px -2px 0 8px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:52vh;overflow:auto;padding-right:2px}
@media(min-width:700px){.gl{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gb{padding:13px 14px;border-radius:12px;text-align:left;font-weight:700;font-size:.86rem;background:var(--sf);border:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb.on{background:var(--ac);border-color:var(--ac);color:#fff}
@media(max-width:560px){.grid{gap:8px}.dl{flex-direction:column}.dl img{width:100px}}
@media(hover:hover){.card:hover .im{box-shadow:0 0 0 2px var(--ac)}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Animanga<span>List</span></h1>
    <div class="seg" id="mode"><button data-m="ANIME">Anime</button><button data-m="MANGA">Manga</button></div>
    <button class="ic" id="gear" aria-label="Settings">⚙</button>
    <form id="sf"><input id="q" type="search" autocomplete="off" enterkeyhint="search"><button class="pri" data-i="go">Cari</button></form>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <h2 id="title"></h2>
  <div id="ctl"></div>
  <div id="out" class="grid"></div>
  <button id="more" class="pri" data-i="more"></button>
</main>

<dialog id="dlg"><button class="x" aria-label="Close" onclick="dlg.close()">×</button><div id="dbody" class="dl"></div></dialog>
<dialog id="set"><button class="x" aria-label="Close" onclick="set.close()">×</button><h3 data-i="set"></h3><div id="setBody"></div></dialog>

<script>
const API = "https://graphql.anilist.co";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = s => (s || "").replace(/__|\*\*/g, "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").replace(/~!|!~/g, "");
const GEN = ["Action","Adventure","Comedy","Drama","Ecchi","Fantasy","Horror","Mahou Shoujo","Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life","Sports","Supernatural","Thriller"];
let ALL = null, tagP = null;
const GSET = new Set();
const SORTS = [["POPULARITY_DESC","s1"],["POPULARITY","s2"],["START_DATE_DESC","s3"],["START_DATE","s4"],["SCORE_DESC","s5"],["SCORE","s6"]];
const TABS = ["pop","rank","new","rec","genre","sched","waifu"];
const L = {
  id:{pop:"Populer",rank:"Ranking",new:"Baru rilis",rec:"Rekomendasi",genre:"Genre",sched:"Jadwal",waifu:"Waifu",ph:"Cari judul…",go:"Cari",more:"Muat lebih banyak",load:"Memuat…",empty:"Tidak ada hasil. Ubah filter atau kata kunci.",retry:"Coba lagi",set:"Pengaturan",lang:"Bahasa",theme:"Tema",auto:"Otomatis",light:"Terang",dark:"Gelap",cols:"Kartu per baris",year:"Semua tahun",reset:"Reset filter",genres:"Genre & tema (bisa pilih banyak)",gs:"Cari genre…",open:"Buka di AniList",res:"Hasil",
    s1:"Terpopuler → terendah",s2:"Terendah → terpopuler",s3:"Terbaru → terlama",s4:"Terlama → terbaru",s5:"Skor tertinggi",s6:"Skor terendah",
    st:{FINISHED:"Selesai",RELEASING:"Sedang rilis",NOT_YET_RELEASED:"Belum rilis",CANCELLED:"Dibatalkan",HIATUS:"Hiatus"},nod:"Belum ada deskripsi.",done:"Sudah tamat",mcAll:"MC: Semua",mcM:"MC: Laki-laki",mcF:"MC: Perempuan",male:"Laki-laki",female:"Perempuan",unk:"Belum diketahui",trn:"Diterjemahkan otomatis ke Bahasa Indonesia",trf:"Terjemahan gagal, menampilkan teks asli",fav:"favorit",err:"Gagal memuat",hint:"Rekomendasi berdasarkan skor. Pilih tahun atau genre untuk mempersempit."},
  en:{pop:"Popular",rank:"Ranking",new:"New releases",rec:"Recommended",genre:"Genres",sched:"Schedule",waifu:"Waifu",ph:"Search titles…",go:"Search",more:"Load more",load:"Loading…",empty:"No results. Change the filters or keywords.",retry:"Try again",set:"Settings",lang:"Language",theme:"Theme",auto:"Auto",light:"Light",dark:"Dark",cols:"Cards per row",year:"All years",reset:"Reset filters",genres:"Genres & themes (pick several)",gs:"Search genres…",open:"Open on AniList",res:"Results",
    s1:"Most → least popular",s2:"Least → most popular",s3:"Newest → oldest",s4:"Oldest → newest",s5:"Highest score",s6:"Lowest score",
    st:{FINISHED:"Finished",RELEASING:"Releasing",NOT_YET_RELEASED:"Upcoming",CANCELLED:"Cancelled",HIATUS:"Hiatus"},nod:"No description yet.",done:"Completed",mcAll:"MC: Any",mcM:"MC: Male",mcF:"MC: Female",male:"Male",female:"Female",unk:"Unknown",trn:"",trf:"",fav:"favorites",err:"Failed to load",hint:"Recommendations ranked by score. Pick a year or genres to narrow down."}
};
let P = {lang:"id", theme:"auto", cols:"5", mode:"ANIME"};
try { Object.assign(P, JSON.parse(localStorage.getItem("aml") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("aml", JSON.stringify(P)); } catch (e) {} };
const t = k => L[P.lang][k] ?? k;
const S = {tab:"pop", genres:[], year:"", sort:"POPULARITY_DESC", wd:new Date().getDay(), q:"", done:false, mc:""};
let st = {list:[], page:1, more:false, b:null}, token = 0;

const M = "id title{romaji english native} coverImage{large} averageScore popularity format episodes chapters status startDate{year} genres description(asHtml:false) siteUrl";
const C = "id name{full native} image{large} gender favourites description(asHtml:false) siteUrl media(perPage:1,sort:POPULARITY_DESC){nodes{title{romaji}}}";
const d0 = new Date(), mo = d0.getMonth();
const [SN, SY] = mo < 2 ? ["WINTER", d0.getFullYear()] : mo < 5 ? ["SPRING", d0.getFullYear()] : mo < 8 ? ["SUMMER", d0.getFullYear()] : mo < 11 ? ["FALL", d0.getFullYear()] : ["WINTER", d0.getFullYear() + 1];

const MC = "characters(role:MAIN,sort:RELEVANCE,perPage:1){nodes{gender}}";
const mq = (args, p) => `{Page(page:${p},perPage:25){pageInfo{hasNextPage} media(type:${P.mode},isAdult:false,${args}){${M} ${MC}}}}`;

async function gql(query, tries = 0){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  let r;
  try { r = await fetch(API, {method:"POST", signal:ctl.signal, headers:{"Content-Type":"application/json", Accept:"application/json"}, body:JSON.stringify({query})}); }
  catch (e) { throw new Error(e.name === "AbortError" ? "Timeout" : "Offline / blocked"); }
  finally { clearTimeout(timer); }
  if (r.status === 429 && tries < 3) { await new Promise(s => setTimeout(s, (+r.headers.get("Retry-After") || 5) * 1000)); return gql(query, tries + 1); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.errors) throw new Error("AniList " + r.status);
  return j.data;
}

const jpl = o => [o.jp, o.ro].filter(Boolean).join(" · ");
const nm = m => {
  const sc = m.averageScore ? (m.averageScore / 10).toFixed(1) : "";
  return {name:m.title.english || m.title.romaji, jp:m.title.native || "", ro:m.title.romaji && m.title.romaji !== (m.title.english || m.title.romaji) ? m.title.romaji : "", img:m.coverImage.large, score:sc,
    mcg:m.characters ? (m.characters.nodes[0] || {}).gender || "" : "",
    mcl:m.characters ? ({Male:t("male"), Female:t("female")}[(m.characters.nodes[0] || {}).gender] || (m.characters.nodes[0] || {}).gender || t("unk")) : undefined,
    meta:[m.format, m.startDate && m.startDate.year, m.episodes ? m.episodes + " eps" : m.chapters ? m.chapters + " ch" : ""].filter(Boolean).join(" · "),
    info:["★ " + (sc || "-"), t("st")[m.status] || "", (m.genres || []).join(", ")].filter(Boolean).join(" · "),
    text:clean(m.description) || t("nod"), url:m.siteUrl};
};

function filt(extra){
  const a = [];
  const gs = S.genres.filter(n => GSET.has(n)), ts = S.genres.filter(n => !GSET.has(n));
  if (gs.length) a.push("genre_in:" + JSON.stringify(gs));
  if (ts.length) a.push("tag_in:" + JSON.stringify(ts));
  if (S.year) a.push(`startDate_greater:${S.year * 10000},startDate_lesser:${(+S.year + 1) * 10000}`);
  if (extra) a.push(extra);
  if (S.done) a.push("status:FINISHED");
  else if (S.sort.startsWith("START")) a.push("status_not:NOT_YET_RELEASED");
  if (S.sort.startsWith("SCORE")) a.push("averageScore_greater:0");
  a.push("sort:" + S.sort);
  return a.join(",");
}

function builder(){
  const k = S.tab;
  if (k === "waifu") return {kind:"char", rank:1, q:p => `{Page(page:${p},perPage:50){pageInfo{hasNextPage} characters(sort:FAVOURITES_DESC){${C}}}}`};
  if (k === "sched") {
    const s = new Date(); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() + (S.wd - s.getDay() + 7) % 7);
    const f = Math.floor(s / 1000) - 1, e = f + 86401;
    const pg = n => `Page(page:${n},perPage:50){airingSchedules(airingAt_greater:${f},airingAt_lesser:${e},sort:TIME){airingAt episode media{${M} isAdult}}}`;
    return {kind:"sched", q:() => `{a:${pg(1)} b:${pg(2)}}`};
  }
  let a;
  if (k === "search") a = `search:${JSON.stringify(S.q)},sort:SEARCH_MATCH`;
  else if (k === "pop") a = "sort:POPULARITY_DESC";
  else if (k === "rank") a = "sort:SCORE_DESC";
  else if (k === "new") a = P.mode === "ANIME" ? `season:${SN},seasonYear:${SY},sort:POPULARITY_DESC` : "status:RELEASING,sort:TRENDING_DESC";
  else a = filt(k === "rec" ? "popularity_greater:5000" : "");
  return {kind:"media", rank:k === "rank", mc:k === "rec" || k === "genre", q:p => mq(a, p)};
}

function norm(data, kind){
  if (kind === "char") return {more:data.Page.pageInfo.hasNextPage, items:data.Page.characters.filter(c => c.gender === "Female").map(c => ({
    name:c.name.full, jp:c.name.native || "", img:c.image.large, score:"", meta:(c.favorites || 0).toLocaleString(P.lang) + " " + t("fav") + (c.media.nodes[0] ? " · " + c.media.nodes[0].title.romaji : ""),
    info:c.name.native || "", text:clean(c.description) || t("nod"), url:c.siteUrl}))};
  if (kind === "sched") {
    const seen = new Set(), out = [];
    [...data.a.airingSchedules, ...data.b.airingSchedules].forEach(x => {
      if (x.media.isAdult || seen.has(x.media.id)) return;
      seen.add(x.media.id);
      const o = nm(x.media);
      o.badge = new Date(x.airingAt * 1000).toLocaleTimeString(P.lang, {hour:"2-digit", minute:"2-digit", hour12:false});
      o.meta = "Ep " + x.episode + " · " + o.meta; o.pop = x.media.popularity || 0;
      out.push(o);
    });
    return {more:false, items:out.sort((a, b) => b.pop - a.pop)};
  }
  return {more:data.Page.pageInfo.hasNextPage, items:data.Page.media.map(nm)};
}

function cards(items, from, rank){
  return items.map((o, i) => {
    const n = from + i, b = o.badge ? `<span class="bd">${esc(o.badge)}</span>` : rank ? `<span class="bd">#${n + 1}</span>` : "";
    return `<button class="card" data-i="${n}"><span class="im">${b}${o.score ? `<span class="sc">★ ${o.score}</span>` : ""}<img loading="lazy" src="${esc(o.img)}" alt="${esc(o.name)}"></span><span class="t">${esc(o.name)}</span>${jpl(o) ? `<span class="m">${esc(jpl(o))}</span>` : ""}<span class="m">${esc(o.meta)}</span></button>`;
  }).join("");
}

async function run(append){
  const my = ++token, out = $("out");
  if (!append) { st = {list:[], page:1, more:false, b:builder()}; out.innerHTML = `<p class="msg">${t("load")}</p>`; $("more").hidden = true; }
  else st.page++;
  try {
    const r = norm(await gql(st.b.q(st.page)), st.b.kind);
    if (my !== token) return;
    if (S.mc && st.b.mc) r.items = r.items.filter(o => o.mcg === S.mc);
    const from = st.list.length;
    st.list = st.list.concat(r.items); st.more = r.more;
    const auto = (st.b.kind === "char" || (S.mc && st.b.mc)) && st.more && st.list.length < 15 && st.page < 10;
    if (!st.list.length) out.innerHTML = `<p class="msg">${auto ? t("load") : t("empty")}</p>`;
    else if (append && from > 0) out.insertAdjacentHTML("beforeend", cards(r.items, from, st.b.rank));
    else out.innerHTML = cards(r.items, 0, st.b.rank);
    $("more").hidden = !st.more;
    if (auto) run(true);
  } catch (e) {
    if (my !== token) return;
    if (append) st.page--;
    out.innerHTML = `<p class="msg">${t("err")} (${esc(e.message)})<br><br><button class="pri" id="retry">${t("retry")}</button></p>`;
    $("retry").onclick = () => run(false);
  }
}

function renderTabs(){
  $("tabs").innerHTML = TABS.filter(k => k !== "sched" || P.mode === "ANIME").map(k => `<button data-t="${k}" class="${S.tab === k ? "on" : ""}">${t(k)}</button>`).join("");
}
function renderTitle(){
  const mode = P.mode === "ANIME" ? "Anime" : "Manga";
  $("title").textContent = S.tab === "search" ? `${t("res")}: "${S.q}"` : S.tab === "waifu" ? t("waifu") : `${t(S.tab)} · ${mode}`;
}
function renderCtl(){
  const c = $("ctl"), k = S.tab;
  if (k === "sched") {
    c.innerHTML = `<div class="row">${[1,2,3,4,5,6,0].map(w => `<button class="chip ${S.wd === w ? "on" : ""}" data-w="${w}">${new Date(2025, 0, 5 + w).toLocaleDateString(P.lang === "id" ? "id-ID" : "en-US", {weekday:"long"})}</button>`).join("")}</div>`;
  } else if (k === "rec" || k === "genre") {
    if (!ALL) { c.innerHTML = `<p class="msg">${t("load")}</p>`; tagP = tagP || loadTags(); return; }
    const yrs = [["", t("year")]];
    for (let y = new Date().getFullYear() + 1; y >= 1970; y--) yrs.push([y, y]);
    c.innerHTML = (k === "rec" ? `<div style="color:var(--mu);font-size:.85rem">${t("hint")}</div>` : "") +
      `<details ${S.genres.length || k === "genre" ? "open" : ""}><summary>${t("genres")} <span id="gc"></span></summary><input id="gq" type="search" autocomplete="off" placeholder="${t("gs")}" style="width:100%;margin-bottom:8px"><div class="gl" id="gl"></div></details>` +
      `<div class="row">${dd("fY", yrs, S.year)}${dd("fS", SORTS.map(([v, l]) => [v, t(l)]), S.sort)}${dd("fM", [["", t("mcAll")], ["Male", t("mcM")], ["Female", t("mcF")]], S.mc)}<button class="chip ${S.done ? "on" : ""}" id="fD">${t("done")}</button><button class="chip" id="fR">${t("reset")}</button></div>`;
    fillGl();
  } else c.innerHTML = "";
}
const dd = (id, opts, val) => {
  const cur = (opts.find(o => String(o[0]) === String(val)) || opts[0])[1];
  return `<div class="dd" id="${id}"><button type="button" class="ddb"><span>${esc(cur)}</span><i>▾</i></button><div class="ddm" hidden>${opts.map(([v, l]) => `<button type="button" class="ddo ${String(v) === String(val) ? "on" : ""}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div></div>`;
};
function renderSet(){
  const f = (l, h) => `<div class="fld"><span>${l}</span>${h}</div>`;
  $("setBody").innerHTML = f(t("lang"), dd("sLang", [["id","Bahasa Indonesia"],["en","English"]], P.lang)) +
    f(t("theme"), dd("sTheme", [["auto",t("auto")],["light",t("light")],["dark",t("dark")]], P.theme)) +
    f(t("cols"), dd("sCols", [3,4,5,6].map(n => [n, n]), P.cols));
}
function ddPick(id, v){
  if (id === "fY") { S.year = v; run(false); }
  else if (id === "fS") { S.sort = v; run(false); }
  else if (id === "fM") { S.mc = v; run(false); }
  else if (id === "sTheme") { P.theme = v; save(); applyTheme(); }
  else if (id === "sCols") { P.cols = v; save(); document.documentElement.style.setProperty("--cols", v); }
  else if (id === "sLang") { P.lang = v; save(); applyLang(); if (st.list.length) run(false); }
}
document.addEventListener("click", e => {
  const d = e.target.closest(".dd");
  document.querySelectorAll(".ddm").forEach(m => { if (!d || m.parentNode !== d) m.hidden = true; });
  if (!d) return;
  const o = e.target.closest(".ddo");
  if (o) {
    d.querySelector(".ddm").hidden = true;
    d.querySelector(".ddb span").textContent = o.textContent;
    d.querySelectorAll(".ddo").forEach(x => x.classList.toggle("on", x === o));
    ddPick(d.id, o.dataset.v);
  } else if (e.target.closest(".ddb")) { const m = d.querySelector(".ddm"); m.hidden = !m.hidden; }
});
function fillGl(){
  const q = ($("gq").value || "").toLowerCase();
  $("gl").innerHTML = ALL.filter(n => n.toLowerCase().includes(q)).map(n => `<button class="gb ${S.genres.includes(n) ? "on" : ""}" data-g="${esc(n)}">${esc(n)}</button>`).join("");
  $("gc").textContent = S.genres.length ? "(" + S.genres.length + ")" : "";
}
async function loadTags(){
  try {
    const d = await gql("{GenreCollection MediaTagCollection{name isAdult}}");
    d.GenreCollection.filter(g => g !== "Hentai").forEach(g => GSET.add(g));
    ALL = [...new Set([...GSET, ...d.MediaTagCollection.filter(x => !x.isAdult).map(x => x.name)])].sort((a, b) => a.localeCompare(b));
  } catch (e) { GEN.forEach(g => GSET.add(g)); ALL = [...GEN]; }
  tagP = null;
  if (S.tab === "rec" || S.tab === "genre") renderCtl();
}
function go(tab){
  S.tab = tab;
  if (tab === "rec") S.sort = "SCORE_DESC"; else if (tab === "genre") S.sort = "POPULARITY_DESC";
  renderTabs(); renderTitle(); renderCtl(); run(false);
}
function applyLang(){
  document.documentElement.lang = P.lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  $("q").placeholder = t("ph");
  renderSet();
  renderTabs(); renderTitle(); renderCtl();
}
function applyTheme(){
  const dark = P.theme === "dark" || (P.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
function applyMode(){
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === P.mode));
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.t); };
$("mode").onclick = e => {
  const b = e.target.closest("button"); if (!b || b.dataset.m === P.mode) return;
  P.mode = b.dataset.m; save(); applyMode();
  go(S.tab === "sched" && P.mode === "MANGA" || S.tab === "search" ? "pop" : S.tab);
};
$("sf").onsubmit = e => {
  e.preventDefault(); const q = $("q").value.trim(); if (!q) return;
  S.q = q; S.tab = "search"; renderTabs(); renderTitle(); renderCtl(); run(false);
};
$("ctl").onclick = e => {
  const g = e.target.closest("[data-g]"), w = e.target.closest("[data-w]");
  if (g) { const v = g.dataset.g, i = S.genres.indexOf(v); i < 0 ? S.genres.push(v) : S.genres.splice(i, 1); fillGl(); run(false); }
  else if (w) { S.wd = +w.dataset.w; renderCtl(); run(false); }
  else if (e.target.id === "fD") { S.done = !S.done; e.target.classList.toggle("on", S.done); run(false); }
  else if (e.target.id === "fR") { S.genres = []; S.year = ""; S.done = false; S.mc = ""; S.sort = S.tab === "rec" ? "SCORE_DESC" : "POPULARITY_DESC"; renderCtl(); run(false); }
};
$("ctl").oninput = e => { if (e.target.id === "gq") fillGl(); };
const TR = new Map();
async function tr(text){
  if (TR.has(text)) return TR.get(text);
  const chunks = []; let cur = "";
  for (const p of text.split(/\n+/).filter(Boolean)) {
    if (cur && (cur + "\n" + p).length > 1800) { chunks.push(cur); cur = p; } else cur = cur ? cur + "\n" + p : p;
  }
  if (cur) chunks.push(cur);
  const out = [];
  for (const c of chunks) {
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=id&dt=t&q=" + encodeURIComponent(c), {signal:AbortSignal.timeout(15000)});
    if (!r.ok) throw new Error("tr");
    const j = await r.json();
    out.push(j[0].map(x => x[0]).join(""));
  }
  const res = out.join("\n\n"); TR.set(text, res); return res;
}
let dTok = 0;
$("out").onclick = e => {
  const c = e.target.closest(".card"); if (!c) return;
  const o = st.list[c.dataset.i], my = ++dTok;
  $("dbody").innerHTML = `<img src="${esc(o.img)}" alt=""><div><h3>${esc(o.name)}</h3>${jpl(o) ? `<div style="color:var(--mu);font-size:.85rem;margin-bottom:4px">${esc(jpl(o))}</div>` : ""}<div style="font-size:.85rem">${esc(o.info)}</div>${o.mcl ? `<div style="font-size:.85rem;margin-top:8px"><b>Main Character:</b> ${esc(o.mcl)}</div>` : ""}<p id="dtx">${esc(o.text)}</p><div id="dnote" style="font-size:.72rem;color:var(--mu);margin-bottom:6px"></div><a href="${esc(o.url)}" target="_blank" rel="noopener">${t("open")}</a></div>`;
  $("dlg").showModal();
  if (P.lang === "id" && o.text !== L.id.nod && o.text !== L.en.nod) {
    $("dnote").textContent = t("load");
    tr(o.text).then(x => { if (my === dTok) { $("dtx").textContent = x; $("dnote").textContent = t("trn"); } })
      .catch(() => { if (my === dTok) $("dnote").textContent = t("trf"); });
  }
};
$("more").onclick = () => run(true);
$("gear").onclick = () => $("set").showModal();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

document.documentElement.style.setProperty("--cols", P.cols);
applyTheme(); applyMode(); applyLang(); run(false);
</script>
</body>
</html>
