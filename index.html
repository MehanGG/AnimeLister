<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeHub</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3fb;--surface:#fff;--ink:#241f3a;--muted:#6d6785;--accent:#e0406f;--line:#e4dcf0;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#14122b;--surface:#1f1c3d;--ink:#f1ecff;--muted:#a59fc4;--accent:#ff8fb1;--line:#322e5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.bar{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{margin:0;font-size:1.5rem;font-weight:900;letter-spacing:-.02em}
h1 span{color:var(--accent)}
form{flex:1;min-width:200px;display:flex;gap:6px}
input{flex:1;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
form button{padding:9px 16px;border:0;border-radius:99px;background:var(--accent);color:#fff;font-weight:700}
nav{max-width:1100px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto}
nav button{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted)}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
h2{margin:0 0 14px;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line)}
.card .t{padding:8px 10px 10px;font-size:.85rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:block;padding:0 10px 10px;font-size:.75rem;color:var(--muted);font-weight:400}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-weight:900;font-size:.8rem;padding:2px 9px;border-radius:99px}
.score{position:absolute;top:8px;right:8px;background:rgba(20,18,43,.8);color:#ffd36b;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.msg{color:var(--muted);padding:30px 0;text-align:center}
dialog{border:0;border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:560px;width:92%;padding:0}
dialog::backdrop{background:rgba(10,8,30,.6)}
.dl{display:flex;gap:14px;padding:18px}
.dl img{width:130px;border-radius:10px;align-self:flex-start}
.dl h3{margin:0 0 6px}
.dl p{font-size:.88rem;color:var(--muted);max-height:240px;overflow:auto;margin:8px 0}
.dl a{color:var(--accent);font-weight:700}
.x{float:right;margin:8px;background:none;border:0;color:var(--muted);font-size:1.3rem}
@media(max-width:480px){.dl{flex-direction:column}.dl img{width:110px}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Anime<span>Hub</span></h1>
    <form id="sf"><input id="q" type="search" placeholder="Cari anime, mis. Frieren" aria-label="Cari anime"><button>Cari</button></form>
  </div>
  <nav id="tabs">
    <button data-t="pop" class="on">Anime populer</button>
    <button data-t="rank">Ranking</button>
    <button data-t="new">Baru rilis</button>
    <button data-t="waifu">Daftar waifu</button>
  </nav>
</header>
<main>
  <h2 id="title"></h2>
  <div id="out" class="grid"></div>
</main>
<dialog id="dlg"><button class="x" aria-label="Tutup" onclick="dlg.close()">×</button><div id="dbody" class="dl"></div></dialog>

<script>
const API = "https://graphql.anilist.co";
const $ = id => document.getElementById(id);
const cache = {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = s => (s || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").replace(/~!|!~/g, "");

const M = "id title{romaji english} coverImage{large} averageScore popularity format episodes seasonYear genres description(asHtml:false) siteUrl";
const C = "id name{full native} image{large} gender favourites description(asHtml:false) siteUrl media(perPage:1,sort:POPULARITY_DESC){nodes{title{romaji}}}";

function season(){
  const d = new Date(), m = d.getMonth(), y = d.getFullYear();
  if (m >= 2 && m <= 4) return ["SPRING", y];
  if (m >= 5 && m <= 7) return ["SUMMER", y];
  if (m >= 8 && m <= 10) return ["FALL", y];
  return ["WINTER", m === 11 ? y + 1 : y];
}
const mediaQ = args => `query($s:String){Page(perPage:24){media(type:ANIME,isAdult:false,${args}){${M}}}}`;
const [SN, SY] = season();

const tabs = {
  pop:   {title:"Anime populer", q:mediaQ("sort:POPULARITY_DESC"), kind:"anime"},
  rank:  {title:"Ranking anime (skor tertinggi)", q:mediaQ("sort:SCORE_DESC"), kind:"anime", rank:true},
  new:   {title:"Anime baru rilis (musim ini)", q:mediaQ(`season:${SN},seasonYear:${SY},sort:POPULARITY_DESC`), kind:"anime"},
  waifu: {title:"Daftar waifu terpopuler", q:`query{a:Page(page:1,perPage:50){characters(sort:FAVOURITES_DESC){${C}}} b:Page(page:2,perPage:50){characters(sort:FAVOURITES_DESC){${C}}}}`, kind:"char", rank:true}
};
let token = 0;

async function gql(query, variables, tries = 0){
  const key = query + JSON.stringify(variables || {});
  if (cache[key]) return cache[key];
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  let r;
  try {
    r = await fetch(API, {method:"POST", signal:ctl.signal, headers:{"Content-Type":"application/json", Accept:"application/json"}, body:JSON.stringify({query, variables})});
  } catch (e) { throw new Error(e.name === "AbortError" ? "Server AniList tidak merespons (timeout)" : "Tidak bisa terhubung ke graphql.anilist.co"); }
  finally { clearTimeout(timer); }
  if (r.status === 429 && tries < 3) {
    await new Promise(s => setTimeout(s, (+r.headers.get("Retry-After") || 5) * 1000));
    return gql(query, variables, tries + 1);
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.errors) throw new Error("AniList menolak permintaan (kode " + r.status + ")");
  return cache[key] = j.data;
}

function norm(data, cfg){
  if (cfg.kind === "char") {
    const all = [...data.a.characters, ...data.b.characters].filter(c => c.gender === "Female").slice(0, 24);
    return all.map(c => ({name:c.name.full, img:c.image.large, meta:(c.favorites || 0).toLocaleString("id-ID") + " favorit" + (c.media.nodes[0] ? " · " + c.media.nodes[0].title.romaji : ""),
      info:c.name.native || "", text:clean(c.description) || "Belum ada deskripsi.", url:c.siteUrl}));
  }
  return data.Page.media.map(m => ({name:m.title.english || m.title.romaji, img:m.coverImage.large,
    score:m.averageScore ? (m.averageScore / 10).toFixed(1) : "",
    meta:[m.format, m.seasonYear, m.episodes ? m.episodes + " eps" : ""].filter(Boolean).join(" · "),
    info:"★ " + (m.averageScore ? (m.averageScore / 10).toFixed(1) : "-") + " · " + (m.genres || []).join(", "),
    text:clean(m.description) || "Belum ada sinopsis.", url:m.siteUrl}));
}

function card(o, i, cfg){
  const badge = cfg.rank ? `<span class="badge">#${i + 1}</span>` : "";
  const score = o.score ? `<span class="score">★ ${o.score}</span>` : "";
  return `<button class="card" data-i="${i}">${badge}${score}<img loading="lazy" src="${esc(o.img)}" alt="${esc(o.name)}"><span class="t">${esc(o.name)}</span><span class="m">${esc(o.meta)}</span></button>`;
}

async function show(title, query, vars, cfg){
  const my = ++token;
  $("title").textContent = title;
  $("out").className = "";
  $("out").onclick = null;
  $("out").innerHTML = '<p class="msg">Memuat…</p>';
  try {
    const list = norm(await gql(query, vars), cfg);
    if (my !== token) return;
    if (!list.length) { $("out").innerHTML = '<p class="msg">Tidak ada hasil. Coba kata kunci lain.</p>'; return; }
    $("out").className = "grid";
    $("out").innerHTML = list.map((o, i) => card(o, i, cfg)).join("");
    $("out").onclick = e => { const c = e.target.closest(".card"); if (c) detail(list[c.dataset.i]); };
  } catch (err) {
    if (my !== token) return;
    $("out").innerHTML = `<p class="msg">${esc(err.message)}.<br><br><button id="retry" style="padding:8px 16px;border-radius:99px;border:0;background:var(--accent);color:#fff;font-weight:700">Coba lagi</button></p>`;
    $("retry").onclick = () => show(title, query, vars, cfg);
  }
}

function detail(o){
  $("dbody").innerHTML = `<img src="${esc(o.img)}" alt=""><div><h3>${esc(o.name)}</h3><div>${esc(o.info)}</div><p style="white-space:pre-line">${esc(o.text)}</p><a href="${esc(o.url)}" target="_blank" rel="noopener">Buka di AniList</a></div>`;
  $("dlg").showModal();
}

function tab(t){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  const c = tabs[t];
  show(c.title, c.q, {}, c);
}

$("tabs").onclick = e => { const b = e.target.closest("button"); if (b) tab(b.dataset.t); };
$("sf").onsubmit = e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("on"));
  show('Hasil pencarian: "' + q + '"', mediaQ("search:$s,sort:SEARCH_MATCH"), {s:q}, {kind:"anime"});
};
tab("pop");
</script>
</body>
</html>
